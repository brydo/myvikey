<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Template</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d11;
            color: #e0e0e6;
            line-height: 1.6;
            padding-bottom: 80px; 
        }

        :root {
            --primary-glow: #9d4edd; 
            --accent-green: #39ff14; 
            --dark-card: #1a1a24;
        }

        /* Navigation Menu Links */
        nav {
            background-color: #111116;
            border-bottom: 2px solid var(--primary-glow);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .logo {
            font-weight: bold;
            color: #ffffff;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent-green);
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a.active, .nav-links a:hover {
            color: var(--accent-green);
        }

        /* Hero Wrapper */
        .hero-banner {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(180deg, #1a0b2e 0%, #0d0d11 100%);
            border-bottom: 1px solid #222;
        }

        /* Content Layout Blocks */
        .main-layout {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .content-panel {
            background-color: var(--dark-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a2a3a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .panel-heading {
            color: var(--primary-glow);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* Action Panel Footer */
        .action-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            background-color: #111116;
            border-top: 1px solid #2a2a3a;
            display: flex;
            justify-content: center;
            z-index: 99;
        }

        .action-button {
            background-color: var(--accent-green);
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            letter-spacing: 1px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Navigation Menu Layout -->
    <nav>
        <div class="nav-container">
            <div class="logo">Logo<span>Here</span></div>
            <div class="nav-links">
                <a href="#weddings">Weddings</a>
                <a href="#engagements">Engagements</a>
                <a href="#parties">Parties</a>
                <a href="#events" class="active">Events</a>
            </div>
        </div>
    </nav>

    <!-- Header Focus Area -->
    <header class="hero-banner">
        <!-- Insert Main Title / Heading Here -->
    </header>

    <!-- Main Content Grid -->
    <main class="main-layout">

        <section class="content-panel">
            <div class="panel-heading"></div>
            <!-- Insert Primary Details / Paragraphs Here -->
        </section>

        <section class="content-panel">
            <div class="panel-heading"></div>
            <!-- Insert Secondary Details / Lists Here -->
        </section>

    </main>

    <!-- Sticky Mobile Interaction Area -->
    <div class="action-footer">
        <button class="action-button"></button>
    </div>

</body>
</html>
