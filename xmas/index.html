<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Your Santa V I Key</title>

  <style>
    /* Full-screen Santa workshop background (your image) */
    body {
      background: url('https://r2.dev') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Inter', Arial, sans-serif;
      color: #334155;
      padding: 32px;
      display: flex;
      justify-content: flex-start; /* shift content left */
      position: relative;
    }

    /* Your blur kept at 1px */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(1px); /* unchanged */
      z-index: 1;
    }

    /* Form moved further left + more transparent */
    .form-container {
      background: rgba(255,255,255,0.65); /* more transparent */
      padding: 36px;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      border: 1px solid #f1f5f9;
      animation: fadeIn 0.4s ease;
      position: relative;
      z-index: 2;
      margin-left: 1%; /* moved further left */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .festive-header {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      padding: 24px;
      border-radius: 14px;
      text-align: center;
      color: #fff;
      margin-bottom: 28px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
    }

    .festive-header::before,
    .festive-header::after {
      content: "";
      position: absolute;
      width: 140%;
      height: 140%;
      top: -20%;
      left: -20%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
      animation: festiveGlow 6s infinite linear;
    }

    .festive-header::after {
      animation-duration: 9s;
      opacity: 0.5;
    }

    @keyframes festiveGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .festive-icon {
      font-size: 2.6rem;
      margin-bottom: 6px;
    }

    .festive-title {
      font-size: 1.9rem;
      font-weight: 800;
      margin: 0;
      letter-spacing: 1px;
    }

    .festive-subtitle {
      font-size: 1rem;
      margin-top: 6px;
      opacity: 0.9;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e293b;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #dc2626;
      outline: none;
      box-shadow: 0 0 0 3px rgba(220,38,38,0.15);
    }

    .consent-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .privacy-note {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 10px;
    }

    .privacy-note a {
      color: #dc2626;
      font-weight: 600;
    }

    button {
      width: 100%;
      background: #dc2626;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #b91c1c;
      transform: translateY(-1px);
    }

    .form-success {
      display: none;
      background: #dcfce7;
      color: #166534;
      padding: 18px;
      border-radius: 8px;
      text-align: center;
      font-weight: 700;
      margin-top: 20px;
      border: 1px solid #bbf7d0;
    }

    .payment-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px solid #e2e8f0;
    }

    .payment-section h3 {
      color: #0f172a;
      margin-bottom: 16px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .bank-details {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 18px;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>

  <div class="form-container">

    <div class="festive-header">
      <div class="festive-icon">""</div>
      <h1 class="festive-title">Letter From Santa</h1>
      <p class="festive-subtitle">A personalised Christmas Letter</p>
    </div>

    <form id="santaForm" action="https://formspree.io" method="POST">

      <div class="form-group">
        <label for="parent_name">Parent / Guardian Full Name:</label>
        <input type="text" id="parent_name" name="parent_name" placeholder="" required>
      </div>

      <div class="form-group">
        <label for="delivery_address">Delivery Address (Street):</label>
        <input type="text" id="delivery_address" name="delivery_address" placeholder="" required>
      </div>

      <div class="form-group">
        <label for="delivery_town">Delivery Town / City:</label>
        <input type="text" id="delivery_town" name="delivery_town" placeholder="" required>
      </div>

      <div class="form-group">
        <label for="delivery_postcode">Delivery Postcode:</label>
        <input type="text" id="delivery_postcode" name="delivery_postcode" placeholder="" required>
      </div>

      <div class="form-group">
        <label for="child_name">Child's First Name:</label>
        <input type="text" id="child_name" name="child_name" placeholder="" required>
      </div>

      <div class="form-group">
        <label for="child_town">Child's Town / City:</label>
        <input type="text" id="child_town" name="child_town" placeholder="" required>
      </div>

      <div class="consent-box">
        <label>
          <input type="checkbox" name="gdpr_consent" required>
          I consent to providing my child's first name and town, and my own delivery details,
          solely to create and post their Santa Tag.
        </label>
        <p class="privacy-note">
          All personalised details are permanently deleted by January 31st.
          Read our full <a href="https://pages.dev" target="_blank">Privacy Policy</a>.
        </p>
      </div>

      <button type="submit">Complete Order</button>
    </form>

   
    <div class="payment-section">
            <div class="bank-details" style="text-align:center;">
        <p style="margin:10px 0;">
          <a id="payLink" href="https://natwestpayit.com" target="_blank" rel="noopener" style="display:inline-block; padding:12px 18px; border-radius:10px; background:linear-gradient(90deg,#0f7a4a,#0b6b47); color:#fff; font-weight:800; text-decoration:none;">Pay for your V I Key®
          It's safe, quick and easy!</a>
        </p>
