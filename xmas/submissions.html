
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Submissions — VI Key</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            padding: 24px;
        }
        .header {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fff;
            padding: 24px 32px;
            border-radius: 14px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 1.6rem; margin-bottom: 4px; }
        .header p { opacity: 0.9; font-size: 0.95rem; }
        .login-box {
            max-width: 400px;
            margin: 60px auto;
            background: #fff;
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }
        .login-box h2 { margin-bottom: 20px; text-align: center; }
        .login-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 16px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .login-box button:hover { background: #b91c1c; }
        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #fff;
            padding: 20px 28px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            min-width: 160px;
        }
        .stat-card .label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-top: 4px; }
        .table-wrap {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #f1f5f9;
            padding: 12px 16px;
            text-align: left;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
        }
        tr:hover { background: #f8fafc; }
        .empty {
            text-align: center;
            padding: 48px;
            color: #94a3b8;
        }
        .actions { display: flex; gap: 8px; }
        .btn-sm {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-view { background: #eff6ff; color: #2563eb; }
        .btn-view:hover { background: #dbeafe; }
        .btn-delete { background: #fef2f2; color: #dc2626; }
        .btn-delete:hover { background: #fee2e2; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal h2 { margin-bottom: 20px; }
        .modal .detail-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .modal .detail-label {
            font-weight: 700;
            min-width: 160px;
            color: #475569;
        }
        .modal .detail-value { flex: 1; }
        .modal-close {
            margin-top: 24px;
            padding: 10px 24px;
            background: #f1f5f9;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .refresh-btn {
            padding: 8px 20px;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .refresh-btn:hover { background: #b91c1c; }
        .logout-btn {
            padding: 8px 20px;
            background: #f1f5f9;
            color: #475569;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="login-box" id="loginBox">
        <h2>🔒 Submissions Viewer</h2>
        <p style="text-align:center;color:#64748b;margin-bottom:20px;font-size:0.9rem;">Enter your password to view orders</p>
        <input type="password" id="secretInput" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
        <button onclick="doLogin()">View Submissions</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="header">
            <h1>🎅 Santa VI-Key Orders</h1>
            <p>View and manage form submissions</p>
        </div>
        <div>
            <button class="refresh-btn" onclick="loadSubmissions()">↻ Refresh</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="stats" id="stats"></div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Parent Name</th>
                        <th>Email</th>
                        <th>Child Name</th>
                        <th>Tags</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Order Details</h2>
            <div id="modalContent"></div>
            <button class="modal-close" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        let secret = null;

        function doLogin() {
            secret = document.getElementById('secretInput').value.trim();
            if (!secret) return;
            loadSubmissions();
        }

        function logout() {
            secret = null;
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('secretInput').value = '';
        }

        async function loadSubmissions() {
            try {
                const resp = await fetch(`/api/submissions?secret=${encodeURIComponent(secret)}`);
                if (resp.status === 401) {
                    alert('Wrong password');
                    return;
                }
                const data = await resp.json();
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                renderTable(data);
                renderStats(data);
            } catch (err) {
                alert('Failed to load submissions');
            }
        }

        function renderStats(subs) {
            const total = subs.length;
            const today = new Date().toDateString();
            const todayCount = subs.filter(s => new Date(s.timestamp).toDateString() === today).length;
            document.getElementById('stats').innerHTML =
                '<div class="stat-card"><div class="label">Total Orders</div><div class="value">' + total + '</div></div>' +
                '<div class="stat-card"><div class="label">Today</div><div class="value">' + todayCount + '</div></div>';
        }

        function renderTable(subs) {
            const tbody = document.getElementById('tableBody');
            if (!subs.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">No submissions yet 🎅</td></tr>';
                return;
            }
            tbody.innerHTML = subs.map(function(s) {
                var date = new Date(s.timestamp).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                return '<tr>' +
                    '<td>' + date + '</td>' +
                    '<td>' + (s.parent_name || '—') + '</td>' +
                    '<td>' + (s.email || '—') + '</td>' +
                    '<td>' + (s.child_name || '—') + '</td>' +
                    '<td>—</td>' +
                    '<td class="actions">' +
                        '<button class="btn-sm btn-view" onclick="viewDetail(\'' + s.id + '\')">View</button>' +
                        '<button class="btn-sm btn-delete" onclick="deleteSub(\'' + s.id + '\')">Delete</button>' +
                    '</td>' +
                '</tr>';
            }).join('');
        }

        async function viewDetail(id) {
            try {
                const resp = await fetch(`/api/submissions?secret=${encodeURIComponent(secret)}&id=${id}`);
                const data = await resp.json();
                const rows = Object.entries(data)
                    .filter(function(k) { return k[0] !== 'id'; })
                    .map(function(entry) {
                        var k = entry[0], v = entry[1];
                        return '<div class="detail-row"><div class="detail-label">' + k + '</div><div class="detail-value">' + (Array.isArray(v) ? v.join(', ') : v) + '</div></div>';
                    }).join('');
                document.getElementById('modalContent').innerHTML = rows;
                document.getElementById('modalOverlay').classList.add('active');
            } catch (err) {
                alert('Failed to load detail');
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        async function deleteSub(id) {
            if (!confirm('Delete this submission? This cannot be undone.')) return;
            try {
                await fetch(`/api/submissions?secret=${encodeURIComponent(secret)}&id=${id}`, { method: 'DELETE' });
                loadSubmissions();
            } catch (err) {
                alert('Failed to delete');
            }
        }

        var urlParams = new URLSearchParams(window.location.search);
        var urlSecret = urlParams.get('secret');
        if (urlSecret) {
            document.getElementById('secretInput').value = urlSecret;
            doLogin();
        }
    </script>
</body>
</html>
