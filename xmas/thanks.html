<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You · Santa V I Key®</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        url('https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/santaweb.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      max-width: 640px;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      border-radius: 18px;
      padding: 36px 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.35);
      text-align: center;
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      color: #b91c1c;
    }

    p {
      margin: 10px 0;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      margin-top: 18px;
      background: linear-gradient(180deg, #dc2626, #b91c1c);
      color: #fff;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 700;
    }

    .btn:hover {
      background: linear-gradient(180deg, #b91c1c, #991b1b);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🎄</div>
    <h1>Thank You!</h1>
    <p>Your order has been submitted successfully.</p>
    <p>We’ve received your details and will use them to create your personalised Santa letter.</p>
    <p>Please keep an eye on your email or order confirmation instructions for the next steps.</p>
    <a class="btn" href="/xmas/index.html">Back to Order Form</a>
  </main>
</body>
</html>
