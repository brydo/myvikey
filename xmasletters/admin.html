<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Xmas Letters · V I Key®</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1a1a1a;
            --gold: #d4af37;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: var(--gold); text-align: center; margin: 30px 0 10px; font-size: 1.5rem; letter-spacing: 1px; }
        p.sub { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.9rem; }
        section {
            background-color: var(--card-bg);
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }
        h2 { color: var(--gold); font-size: 1.1rem; margin-bottom: 16px; font-weight: 500; }
        label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            background-color: #121212;
            color: var(--text-color);
            border: 1px solid #333;
            border-radius: 8px;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        input:focus, textarea:focus { border-color: var(--gold); }
        textarea { min-height: 120px; resize: vertical; }
        button {
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--gold);
            background-color: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: rgba(212, 175, 55, 0.2); }
        button.secondary {
            color: var(--text-muted);
            background-color: transparent;
            border-color: #333;
            margin-left: 8px;
        }
        button.secondary:hover { background-color: rgba(255,255,255,0.05); }
        .msg { font-size: 0.9rem; margin-top: 12px; min-height: 1.2em; }
        .msg.ok { color: #4caf50; }
        .msg.err { color: #ff6b6b; }
        .btn-row { display: flex; align-items: center; }
        .status { font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-top: 20px; }
        .status a { color: var(--gold); text-decoration: none; }
        .page-list { margin-top: 12px; }
        .page-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .page-list-item .id { color: var(--gold); font-weight: 600; }
        .page-list-item .badges { font-size: 0.8rem; color: var(--text-muted); }
