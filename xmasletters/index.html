<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xmas Letter</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #f4f0e6;
        font-family: 'Georgia', serif;
    }

    #scroll {
        max-width: 700px;
        margin: 0 auto;
        padding: 40px 20px 120px; /* extra bottom padding for footer */
        background: url('scroll.png') no-repeat center top;
        background-size: contain;
        min-height: 80vh;
    }

    #letterText {
        font-size: 28px;
        color: #b30000;
        text-align: center;
        margin-top: 40px;
        padding: 20px;
    }

    /* FOOTER AUDIO PLAYER */
    footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.9);
        padding: 10px 0;
        text-align: center;
        box-shadow: 0 -3px 8px rgba(0,0,0,0.2);
    }

    audio {
        width: 220px; /* smaller player */
        height: 30px;
    }

    /* REMOVE DOWNLOAD BUTTON */
    audio::-webkit-media-controls-download-button {
        display: none;
    }
    audio::-webkit-media-controls-enclosure {
        overflow: hidden;
    }
</style>
</head>

<body>

<div id="scroll">
    <div id="letterText">Loading...</div>
</div>

<!-- FOOTER AUDIO PLAYER -->
<footer>
    <audio id="audioPlayer" controls></audio>
</footer>

<script>
    // Get ID from URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    // Load saved content from admin JSON
    fetch("data.json")
        .then(response => response.json())
        .then(data => {
            const person = data[id];

            if (!person) {
                document.getElementById("letterText").innerText = "Letter not found.";
                return;
            }

            // Set letter text
            document.getElementById("letterText").innerText = person.letter;

            // Set MP3 source
            const audio = document.getElementById("audioPlayer");

            if (person.mp3 && person.mp3.length > 0) {
                audio.src = person.mp3;
            } else {
                audio.src = `assets/${id}.mp3`;
            }
        });
</script>

</body>
</html>
