<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyViKey Letter</title>

  <!-- Handwritten font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet" />

  <style>
    /* Page base */
    body {
      margin: 0;
      padding: 0;
      background: #f7f3ea;
      color: #2f2a24;
      font-family: Arial, sans-serif;
    }

    /* Your existing overlay container */
    .text-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    /* Letter content with handwritten style */
    #letterContainer.letter-content {
      font-family: 'Patrick Hand', cursive;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      line-height: 1.7;
      letter-spacing: 0.3px;
      color: #2f2a24;
      max-width: 760px;
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(1px);
    }
  </style>
</head>
<body>
  <div class="text-overlay">
    <div id="letterContainer" class="letter-content">Loading your letter come back soon ...</div>
  </div>
</body>
</html>
