<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Xmas Letters</title>

<style>
   

        body {
    background: url('https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/cosy.jpg') no-repeat center center fixed;
    background-size: cover;
}


    .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    h1 {
        margin-top: 0;
        font-size: 28px;
    }

    p {
        font-size: 18px;
        line-height: 1.5;
    }
</style>
</head>

<body>
<div class="container">
    <h1 id="title"></h1>
    <p id="content"></p>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
        document.getElementById("title").innerText = "Xmas Letters Home";
        document.getElementById("content").innerText = "Try ?id=paulml1 or any name.";
    } else {
        document.getElementById("title").innerText = "Letter for: " + id;
        document.getElementById("content").innerText = "This is the your personal letter  " + id; "written especailly for you by santa"
    }
</script>

</body>
</html>
