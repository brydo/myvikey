<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Letter · V I Key®</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1a1a1a;
            --gold: #d4af37;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .letter-card {
            background-color: var(--card-bg);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 40px 32px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .letter-icon { font-size: 3rem; margin-bottom: 20px; }
        .letter-card h1 {
            color: var(--gold);
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }
        .letter-text {
            color: var(--text-color);
            font-size: 1.05rem;
            margin-bottom: 30px;
            white-space: pre-wrap;
            text-align: left;
        }
        .audio-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #2a2a2a;
        }
        .audio-label {
            color: var(--gold);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        audio {
            width: 100%;
            margin-top: 8px;
        }
        .footer {
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .footer a { color: var(--gold); text-decoration: none; }
        .empty {
            color: var(--text-muted);
            font-size: 1rem;
            padding: 40px 0;
        }
        .empty-icon { font-size: 3rem; margin-bottom: 16px; }
        @media (max-width: 480px) {
            .letter-card { padding: 30px 20px; }
            .letter-card h1 { font-size: 1.3rem; }
            .letter-text { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="letter-card">
        <div id="letterContent">
            <div class="empty-icon">🎄</div>
            <div class="empty">Loading your Christmas letter...</div>
        </div>
        <div class="footer">
            <a href="https://wa.me/447526345287">V I Key®</a>
        </div>
    </div>

    <script>
        async function loadContent() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const el = document.getElementById('letterContent');

            if (!id) {
                el.innerHTML = '<div class="empty-icon">🎄</div><div class="empty">No letter ID provided.</div>';
                return;
            }

            try {
                const resp = await fetch('/xmasletters/api/content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get-content', id })
                });
                const data = await resp.json();

                if (data.success && data.content) {
                    let html = '<div class="letter-icon">🎄</div>';
                    html += '<h1>Your Christmas Letter</h1>';

                    if (data.content.text) {
                        html += `<div class="letter-text">${escapeHtml(data.content.text)}</div>`;
                    }

                    if (data.content.audioUrl) {
                        html += '<div class="audio-section">';
                        html += '<div class="audio-label">🎵 Listen to your letter</div>';
                        html += `<audio controls preload="metadata"><source src="${escapeHtml(data.content.audioUrl)}" type="audio/mpeg"></audio>`;
                        html += '</div>';
                    }

                    if (!data.content.text && !data.content.audioUrl) {
                        html = '<div class="empty-icon">🎄</div><div class="empty">This letter is not ready yet. Please check back soon.</div>';
                    }

                    el.innerHTML = html;
                    document.title = `Christmas Letter · ${id}`;
                } else {
                    el.innerHTML = '<div class="empty-icon">🎄</div><div class="empty">This letter is not ready yet. Please check back soon.</div>';
                }
            } catch (e) {
                el.innerHTML = '<div class="empty-icon">🎄</div><div class="empty">Something went wrong. Please try again later.</div>';
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        loadContent();
    </script>
</body>
</html>
