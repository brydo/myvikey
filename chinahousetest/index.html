        justify-content: center;
        gap: 30px;
        z-index: 1000;
    }

    .footer-btn {

        align-items: center;

        line-height: 1;
        text-decoration: none;
        color: #e8e6e3;
        transition: color 0.3s;
    }

    }

        height: 1em;

        vertical-align: middle;
    }

    .footer-btn .instagram-icon {

        height: 1em;
        fill: #E4405F;
        display: inline-block;
        vertical-align: middle;
    }

    .footer-btn .tiktok-icon {
        width: 1em;
        height: 1em;
        fill: #e8e6e3;
        display: inline-block;
        vertical-align: middle;
    }

    .footer-btn .email-icon {
        font-size: 1em;
        display: inline-block;
        line-height: 1;
    }

    .footer-btn:hover {
        color: #c9a96e;
    }

    @media (max-width: 480px) {
        footer {
            gap: 20px;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
    }
</style>
