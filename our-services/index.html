<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services - VI Key®</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1a1a1a;
            --gold: #d4af37;
            --gold-hover: #f3e5ab;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Top Dead Centre Logo */
        .tdc-logo {
            display: block;
            margin: 40px auto 20px auto;
            max-width: 140px;
            width: 30%;
            height: auto;
        }

        /* Navigation */
        .page-nav {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 8px;
            padding: 0 10px;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 10px;
            transition: color 0.3s;
            white-space: nowrap;
        }

        .nav-link.active, .nav-link:hover {
            color: var(--gold);
            border-bottom: 1px solid var(--gold);
        }

        .nav-divider {
            color: #444;
            font-size: 0.9rem;
        }

        /* Main Content Packaging */
        .content-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1, h2, h3 {
            color: var(--gold);
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        section {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #2a2a2a;
        }

        p {
            margin-bottom: 15px;
            color: var(--text-color);
            font-size: 1.05rem;
        }

        .divider-icon {
            text-align: center;
            font-size: 1.8rem;
            color: var(--gold);
            margin: 30px 0;
        }

        /* Service Cards */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 25px 0;
        }

        .service-card {
            background-color: var(--card-bg);
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 20px 16px;
            text-align: center;
            transition: border-color 0.3s, transform 0.3s;
        }

        .service-card:hover {
            border-color: var(--gold);
            transform: translateY(-4px);
        }

        .service-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .service-card h3 {
            color: var(--gold);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .service-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 0;
        }

        .cta-link {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--gold);
            background-color: rgba(212, 175,  ✦: 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .cta-link:hover {
            background-color: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .cta-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .tdc-logo {
                max-width: 120px;
            }

            h1 {
                font-size: 1.7rem;
                letter-spacing: 1.5px;
            }

            section {
                padding: 25px 20px;
            }

            p {
                font-size: 1rem;
            }
        }

        /* Phone */
        @media (max-width: 480px) {
            .tdc-logo {
                margin: 25px auto 15px auto;
                max-width: 100px;
            }

            .page-nav {
                gap: 2px 6px;
                margin-bottom: 25px;
            }

            .nav-link {
                font-size: 0.8rem;
                padding: 5px 8px;
                letter-spacing: 0.5px;
            }

            .content-container {
                padding: 0 12px;
            }

            h1 {
                font-size: 1.5rem;
                (letter-spacing: 1px;
                margin-bottom: 25px;
            }

            h2 {
                font-size: 1.2rem;
            }

            section {
                padding: 20px 16px;
                margin-bottom: 20px;
            }

            p {
                font-size: 0.95rem;
                margin-bottom: 12px;
            }

            .divider-icon {
                font-size: 1.5rem;
                margin: 20px 0;
            }

            .services-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .service-card {
                padding: 16px 14px;
            }

            .cta-row {
                flex-direction: column;
                gap: 12px;
            }

            .cta-link {
                padding: 12px 24px;
                font-size: 0.95rem;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
