    <style>
        :root {
            --bg-base: #12110F;
            --bg-gradient: radial-gradient(circle at top, #1c1a16 0%, #12110F 70%);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --gold: #c9a96e;
            --text-color: #e8e6e3;
            --text-muted: #a8a4a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-color: var(--bg-base);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 90px;
        }

        .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 0; }
        .state {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 40px 24px;
            text-align: center;
            margin-top: 40px;
        }
        .state h2 { color: var(--gold); margin-bottom: 12px; font-size: 1.3rem; }
        .state p { color: var(--text-muted); margin-bottom: 20px; }
        .state a { color: var(--gold); }
        .password-input { max-width: 320px; margin: 0 auto 12px; display: flex; gap: 8px; }
        .password-input input {
            flex: 1; min-width: 0; padding: 12px 14px; font-size: 1rem;
            background-color: var(--bg-base); color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; outline: none;
        }
        .password-input input:focus { border-color: var(--gold); }
        .password-input button {
            padding: 12px 20px; font-size: 0.95rem; font-weight: 600; color: var(--gold);
            background-color: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.3);
            border-radius: 8px; cursor: pointer;
        }
        .password-input button:hover { background-color: rgba(201,169,110,0.2); }
        .error-msg { color: #ff8a8a; font-size: 0.9rem; min-height: 1.2em; }
        .back-link { text-align: center; margin-top: 20px; font-size: 0.9rem; }
        .back-link a { color: var(--text-muted); text-decoration: none; }
        .back-link a:hover { color: var(--gold); }
        footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: #0d0c0a;
            border-top: 1px solid var(--card-border);
            padding: 12px 20px;
            display: flex; justify-content: center; gap: 30px;
            z-index: 1000;
        }
        .footer-btn { display: inline-flex; align-items: center; font-size: 20px; line-height: 1; text-decoration: none; color: var(--text-color); transition: color 0.3s; }
        .footer-btn svg { width: 1em; height: 1em; display: inline-block; }
        .footer-btn .whatsapp-icon { fill: #25D366; }
        .footer-btn .facebook-icon { fill: #1877F2; }
        .footer-btn .instagram-icon { fill: #E4405F; }
        .footer-btn .tiktok-icon { fill: #e8e6e3; }
        .footer-btn .email-icon { color: var(--gold); }
        .footer-btn:hover { color: var(--gold); }
        .footer-btn:focus-visible, a:focus-visible, button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    </style>
</head>
<body>
    <main class="wrap">
        <div id="loading" class="state" role="status"><p>Loading card…</p></div>

        <div id="cardRoot"></div>

        <div id="notFound" class="state" style="display:none;">
            <h2>Card not found</h2>
            <p>We couldn't find a card with that ID. Please check the link and try again.</p>
            <a href="/mycard/">About MyCard</a>
        </div>

        <div id="passwordPrompt" class="state" style="display:none;">
            <h2>This card is private</h2>
            <p>Please enter the password to view this card.</p>
            <div class="password-input">
                <input type="password" id="passwordField" placeholder="Password" aria-label="Password" autocomplete="current-password">
                <button type="button" id="passwordBtn">View</button>
            </div>
            <div class="error-msg" id="passwordMsg" role="alert"></div>
        </div>

        <div class="back-link" id="backLink" style="display:none;"><a href="/mycard/">Get your own MyCard →</a></div>
    </main>

    <script src="/mycard/qrcode.js"></script>
    <script src="/mycard/card-render.js"></script>
    <script>
        var cardId = (new URLSearchParams(window.location.search).get('id') || '').trim();
        if (!cardId) {
            window.location.href = '/mycard/';
        }

        function show(which) {
            ['loading', 'notFound', 'passwordPrompt'].forEach(function (id) {
                document.getElementById(id).style.display = id === which ? 'block' : 'none';
            });
        }

        function cardUrl() {
            return window.location.origin + '/mycard/?id=' + encodeURIComponent(cardId);
        }

        async function post(path, payload) {
            var resp = await fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            var data = {};
            try { data = await resp.json(); } catch (e) {}
            return { status: resp.status, ok: resp.ok, data: data };
        }

        async function loadCard(password) {
            var r = await post('/api/card-content', { action: 'get-content', id: cardId, password: password || '' });
            if (r.status === 401) { show('passwordPrompt'); return false; }
            if (!r.ok || !r.data.success || !r.data.content) { show('notFound'); return true; }
            var c = r.data.content;
            show('');
            MyCard.render(document.getElementById('cardRoot'), c, { url: cardUrl() });
            document.getElementById('backLink').style.display = 'block';
            var title = (c.name || 'MyCard') + (c.title ? ' · ' + c.title : '') + ' · V I Key®';
            document.title = title;
            document.getElementById('ogTitle').setAttribute('content', title);
            if (c.bio) document.getElementById('ogDesc').setAttribute('content', String(c.bio).slice(0, 200));
            return true;
        }

        async function init() {
            if (!cardId) return;
            try {
                var v = await post('/api/card-password', { action: 'verify', id: cardId, password: '' });
                if (v.status === 401) { show('passwordPrompt'); document.getElementById('passwordField').focus(); return; }
                await loadCard('');
            } catch (e) {
                show('notFound');
            }
        }

        async function submitPassword() {
            var field = document.getElementById('passwordField');
            var msg = document.getElementById('passwordMsg');
            var password = field.value;
            if (!password) { msg.textContent = 'Please enter a password.'; return; }
            msg.textContent = '';
            try {
                var v = await post('/api/card-password', { action: 'verify', id: cardId, password: password });
                if (v.ok && v.data.success) {
                    await loadCard(password);
                } else {
                    msg.textContent = 'Incorrect password.';
                    field.value = '';
                    field.focus();
                }
            } catch (e) {
                msg.textContent = 'Error verifying password.';
            }
        }

        document.getElementById('passwordBtn').addEventListener('click', submitPassword);
        document.getElementById('passwordField').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') submitPassword();
        });
        init();
    </script>
