<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta property="og:title" id="ogTitle" content="MyCard · V I Key®">
    <meta property="og:description" id="ogDesc" content="A tap-to-share digital business card by V I Key®.">
    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://vi-key.uk/mycard/">
    <meta property="og:image" content="https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/transparentlogo.png">
    <title>MyCard · V I Key®</title>
    <link rel="stylesheet" href="/mycard/card.css">
    <style>
        :root {
            --bg-base: #12110F;
            --bg-gradient: radial-gradient(circle at top, #1c1a16 0%, #12110F 70%);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --gold: #c9a96e;
            --text-color: #e8e6e3;
            --text-muted: #a8a4a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(ellipse at 50% 38%, rgba(147,51,234,0.13), transparent 44%),
                radial-gradient(ellipse at 50% 45%, rgba(37,99,235,0.11), transparent 54%),
                var(--bg-gradient);
            background-color: var(--bg-base);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            min-height: 100svh;
            padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
        }

        .wrap {
            width: min(100%, 560px);
            min-height: calc(100vh - 68px - env(safe-area-inset-bottom, 0px));
            min-height: calc(100svh - 68px - env(safe-area-inset-bottom, 0px));
            margin: 0 auto;
            padding: clamp(36px, 8vh, 84px) 20px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
        }
        .state {
            background: rgba(20, 19, 24, 0.78);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px 24px;
            text-align: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .state h2 { color: var(--gold); margin-bottom: 12px; font-size: 1.3rem; }
        .state p { color: var(--text-muted); margin-bottom: 20px; line-height: 1.65; }
        .state a { color: var(--gold); }
        .password-input { max-width: 320px; margin: 0 auto 12px; display: flex; gap: 8px; }
        .password-input input {
            flex: 1; min-width: 0; padding: 12px 14px; font-size: 1rem;
            background-color: var(--bg-base); color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; outline: none;
        }
        .password-input input:focus-visible { border-color: var(--gold); outline: 3px solid #fff; outline-offset: 2px; }
        .password-input button {
            min-height: 46px; padding: 12px 20px; font-size: 0.95rem; font-weight: 600; color: var(--gold);
            background-color: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.3);
            border-radius: 8px; cursor: pointer;
        }
        .password-input button:hover { background-color: rgba(201,169,110,0.2); }
        .error-msg { color: #ff8a8a; font-size: 0.9rem; min-height: 1.2em; }
        .back-link { min-height: 44px; display: flex; justify-content: center; align-items: center; text-align: center; font-size: 0.9rem; }
        .back-link a { color: var(--text-muted); text-decoration: none; }
        .back-link a:hover { color: var(--gold); }

        /* New company branding block */
        .company-branding {
            display: none;
            width: min(100%, 480px);
            margin: 0 auto 14px;
            padding: 14px 16px;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            text-align: center;
        }
        .company-branding.has-content { display: block; }
        .company-logo-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }
        .company-logo {
            max-width: 220px;
            max-height: 84px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
        }
        .company-name {
            color: var(--gold);
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.3;
            letter-spacing: 0.2px;
        }

        footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: #0d0c0a;
            border-top: 1px solid var(--card-border);
            padding: 15px 20px calc(15px + env(safe-area-inset-bottom, 0px));
            display: flex; justify-content: center; gap: 30px;
            z-index: 1000;
        }
        .footer-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; line-height: 1; text-decoration: none; color: var(--text-color); transition: color 0.3s; }
        .footer-btn svg { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
        .footer-btn .whatsapp-icon { fill: #25D366; }
        .footer-btn .facebook-icon { fill: #1877F2; }
        .footer-btn .instagram-icon { fill: #E4405F; }
        .footer-btn .tiktok-icon { fill: #e8e6e3; }
        .footer-btn .email-icon { color: var(--gold); font-size: 1em; display: inline-block; line-height: 1; }
        .footer-btn:hover { color: var(--gold); }
        .footer-btn:focus-visible, a:focus-visible, button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
        @media (max-width: 480px) {
            .wrap { padding-right: 16px; padding-left: 16px; gap: 14px; }
            .state { padding: 34px 20px; }
            .company-logo { max-width: 180px; max-height: 72px; }
            footer { gap: 20px; flex-wrap: nowrap; align-items: center; padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <div id="loading" class="state" role="status"><p>Loading card…</p></div>

        <!-- New branding area -->
        <section id="companyBranding" class="company-branding" aria-label="Company branding">
            <div id="companyLogoWrap" class="company-logo-wrap" style="display:none;">
                <img id="companyLogo" class="company-logo" alt="Company logo" loading="lazy" decoding="async">
            </div>
            <div id="companyName" class="company-name" style="display:none;"></div>
        </section>

        <div id="cardRoot"></div>

        <div id="notFound" class="state" style="display:none;">
            <h2>Card not found</h2>
            <p>We couldn't find a card with that ID. Please check the link and try again, or get your own tap-to-share MyCard.</p>
            <a href="/mycard/">Get your own tap-to-share MyCard →</a>
        </div>

        <div id="passwordPrompt" class="state" style="display:none;">
            <h2>This card is private</h2>
            <p>Please enter the password to view this card.</p>
            <div class="password-input">
                <input type="password" id="passwordField" placeholder="Password" aria-label="Password" autocomplete="current-password">
                <button type="button" id="passwordBtn">View</button>
            </div>
            <div class="error-msg" id="passwordMsg" role="alert"></div>
        </div>

        <div class="back-link" id="backLink" style="display:none;"><a href="/mycard/">Get your own tap-to-share MyCard →</a></div>
    </main>

    <footer>
        <a href="https://wa.me/qr/S3WV63OUV4CTP1" class="footer-btn" target="_blank" rel="noopener noreferrer">
            <svg class="whatsapp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.556-5.338 11.891-11.893 11.891a11.96 11.96 0 0 1-5.946-1.587L.057 24z"/>
            </svg>
        </a>
        <a href="mailto:vikeyshop@outlook.com" class="footer-btn">
            <span class="email-icon">✉</span>
        </a>
        <a href="https://www.facebook.com/vi.key.page" class="footer-btn" target="_blank" rel="noopener noreferrer">
            <svg class="facebook-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953h-1.513c-1.491 0-1.956.926-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
        </a>
        <a href="https://www.instagram.com/vi_key_shop?stkn=dHpzNHZqemh5dTIy" class="footer-btn" target="_blank" rel="noopener noreferrer">
            <svg class="instagram-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.645.069-4.85.069-3.204 0-3.584-.012-4.849-.069-3.225-.149-4.771-1.694-4.919-4.919-.058-1.266-.069-1.644-.069-4.849 0-3.204.013-3.583.069-4.849.149-3.227 1.694-4.771 4.919-4.919 1.266-.059 1.645-.07 4.849-.07z"/>
            </svg>
        </a>
        <a href="https://www.tiktok.com/@vi_keyshop" class="footer-btn" target="_blank" rel="noopener noreferrer">
            <svg class="tiktok-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 19.2 6.36 6.36 0 0 0 15.9 15V9.33a8.16 8.16 0 0 0 4.77 1.53V7.41a4.85 4.85 0 0 1-1.08-.72z"/>
            </svg>
        </a>
    </footer>

    <script src="/mycard/card-render.js"></script>
    <script>
        var cardId = (new URLSearchParams(window.location.search).get('id') || '').trim();
        if (!cardId) {
            window.location.href = '/mycard/';
        }

        function show(which) {
            ['loading', 'notFound', 'passwordPrompt'].forEach(function (id) {
                document.getElementById(id).style.display = id === which ? 'block' : 'none';
            });
        }

        function cardUrl() {
            return window.location.origin + '/mycard/?id=' + encodeURIComponent(cardId);
        }

        function textOrEmpty(value) {
            return (value == null ? '' : String(value)).trim();
        }

        function isValidLogoUrl(url) {
            if (!url) return false;
            try {
                var u = new URL(url, window.location.origin);
                return ['http:', 'https:'].indexOf(u.protocol) !== -1;
            } catch (e) {
                return false;
            }
        }

        function renderCompanyBranding(content) {
            var brandingRoot = document.getElementById('companyBranding');
            var logoWrap = document.getElementById('companyLogoWrap');
            var logoImg = document.getElementById('companyLogo');
            var companyNameEl = document.getElementById('companyName');

            var companyName =
                textOrEmpty(content.companyName) ||
                textOrEmpty(content.company_name) ||
                textOrEmpty(content.businessName) ||
                textOrEmpty(content.business_name);

            var companyLogo =
                textOrEmpty(content.companyLogoUrl) ||
                textOrEmpty(content.company_logo_url) ||
                textOrEmpty(content.companyLogo) ||
                textOrEmpty(content.company_logo);

            var hasLogo = isValidLogoUrl(companyLogo);
            var hasName = !!companyName;

            if (hasLogo) {
                logoImg.src = companyLogo;
                logoImg.alt = companyName ? (companyName + ' logo') : 'Company logo';
                logoWrap.style.display = 'flex';
            } else {
                logoImg.removeAttribute('src');
                logoImg.alt = 'Company logo';
                logoWrap.style.display = 'none';
            }

            if (hasName) {
                companyNameEl.textContent = companyName;
                companyNameEl.style.display = 'block';
            } else {
                companyNameEl.textContent = '';
                companyNameEl.style.display = 'none';
            }

            if (hasLogo || hasName) {
                brandingRoot.classList.add('has-content');
            } else {
                brandingRoot.classList.remove('has-content');
            }
        }

        async function post(path, payload) {
            var resp = await fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            var data = {};
            try { data = await resp.json(); } catch (e) {}
            return { status: resp.status, ok: resp.ok, data: data };
        }

        async function loadCard(password) {
            var r = await post('/api/card-content', { action: 'get-content', id: cardId, password: password || '' });
            if (r.status === 401) { show('passwordPrompt'); return false; }
            if (!r.ok || !r.data.success || !r.data.content) { show('notFound'); return true; }

            var c = r.data.content;
            show('');

            // Render optional company branding block first
            renderCompanyBranding(c);

            MyCard.render(document.getElementById('cardRoot'), c, { url: cardUrl() });
            document.getElementById('backLink').style.display = 'block';

            var title = (c.name || 'MyCard') + (c.title ? ' · ' + c.title : '') + ' · V I Key®';
            document.title = title;
            document.getElementById('ogTitle').setAttribute('content', title);
            if (c.bio) document.getElementById('ogDesc').setAttribute('content', String(c.bio).slice(0, 200));
            return true;
        }

        async function init() {
            if (!cardId) return;
            try {
                var v = await post('/api/card-password', { action: 'verify', id: cardId, password: '' });
                if (v.status === 401) { show('passwordPrompt'); document.getElementById('passwordField').focus(); return; }
                await loadCard('');
            } catch (e) {
                show('notFound');
            }
        }

        async function submitPassword() {
            var field = document.getElementById('passwordField');
            var msg = document.getElementById('passwordMsg');
            var password = field.value;
            if (!password) { msg.textContent = 'Please enter a password.'; return; }
            msg.textContent = '';
            try {
                var v = await post('/api/card-password', { action: 'verify', id: cardId, password: password });
                if (v.ok && v.data.success) {
                    await loadCard(password);
                } else {
                    msg.textContent = 'Incorrect password.';
                    field.value = '';
                    field.focus();
                }
            } catch (e) {
                msg.textContent = 'Error verifying password.';
            }
        }

        document.getElementById('passwordBtn').addEventListener('click', submitPassword);
        document.getElementById('passwordField').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') submitPassword();
        });
        init();
    </script>
</body>
</html>
