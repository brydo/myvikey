<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Subcontractor · MyCard · V I Key®</title>
    <style>
        :root { color-scheme: dark; --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --muted: #a0a0a0;
            --primary: #00adb5; --border: rgba(255,255,255,0.12); --danger: #e35d6a; --ok: #2fbf71; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); padding: 24px 16px 60px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        main { max-width: 560px; margin: 0 auto; }
        main.wide { max-width: 760px; }
        h1 { font-size: 1.5rem; margin: 0 0 6px; }
        p { color: var(--muted); line-height: 1.5; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-top: 18px; }
        label { display: block; font-size: 0.9rem; margin: 14px 0 6px; }
        input[type=text], input[type=password], input[type=email], input[type=url], textarea {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            background: #161616; color: var(--text); font-size: 16px; font-family: inherit; }
        textarea { min-height: 110px; resize: vertical; }
        input[type=color] { width: 56px; height: 40px; border: 0; background: none; padding: 0; vertical-align: middle; }
        button { padding: 12px 18px; border: 0; border-radius: 8px; background: var(--primary); color: #00181a;
            font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 18px; }
        button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .links { margin-top: 16px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.9rem; }
        a { color: var(--primary); }
        .msg { margin-top: 14px; min-height: 1.2em; font-size: 0.95rem; }
        .msg.err { color: var(--danger); }
        .msg.ok { color: var(--ok); }
        .grid { display: grid; gap: 0 16px; grid-template-columns: 1fr 1fr; }
        .grid .full { grid-column: 1 / -1; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .bar button { margin-top: 0; }
        [hidden] { display: none !important; }
        .images { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; margin: 16px 0; }
        @media (max-width: 600px) { .images { grid-template-columns: 1fr; } }
        .imgbox { border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
        .imgbox img { display: block; max-width: 100%; max-height: 140px; margin-bottom: 8px; border-radius: 6px; background: #fff; }
        .imgbox .small { font-size: 0.85rem; opacity: 0.8; margin: 4px 0; }
    </style>
</head>
<body>
    <main id="main" class="wide">
        <h1>MyCard subcontractor</h1>
        <p id="intro">Sign in to manage your cards.</p>

        <section class="panel" id="signinView">
            <form id="signinForm">
                <label for="siEmail">Email</label>
                <input type="email" id="siEmail" autocomplete="username" required>
                <label for="siPass">Password</label>
                <input type="password" id="siPass" autocomplete="current-password" required>
                <button type="submit">Sign in</button>
            </form>
            <div class="links"><a href="#" data-view="forgot">Forgot your password?</a></div>
        </section>

        <section class="panel" id="forgotView" hidden>
            <form id="forgotForm">
                <label for="fgEmail">Your email</label>
                <input type="email" id="fgEmail" required>
                <button type="submit">Email me a reset link</button>
            </form>
            <div class="links"><a href="#" data-view="signin">Back to sign in</a></div>
        </section>

        <section class="panel" id="resetView" hidden>
            <form id="resetForm">
                <label for="rsPass">Choose a password (8+ characters)</label>
                <input type="password" id="rsPass" autocomplete="new-password" minlength="8" required>
                <button type="submit">Save password</button>
            </form>
        </section>

        <section class="panel" id="homeView" hidden>
            <div class="bar">
                <strong id="allowanceText"></strong>
                <button type="button" class="secondary" id="signOutBtn">Sign out</button>
            </div>
            <form id="batchForm">
                <label for="batchCount">Create new cards (1–100 at a time)</label>
                <input type="text" inputmode="numeric" id="batchCount" value="10" style="max-width:140px;">
                <button type="submit">Create cards</button>
                <button type="button" class="secondary" id="csvBtn" hidden>Download CSV</button>
            </form>
            <p>The new codes are shown here once and emailed to you. Keep them private: each code lets its holder claim that card.</p>
            <div id="newCodes"></div>
            <h2 style="font-size:1.1rem;margin-top:24px;">My cards</h2>
            <div id="cardList"></div>
        </section>

        <div class="msg" id="msg" role="status"></div>
    </main>
    <script src="/mycard/sub.js"></script>
</body>
</html>
