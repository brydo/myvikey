<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    html, body {
      background: #fff !important;
      background-image: none !important;
    }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin · MyCard · V I Key®</title>
  <link rel="stylesheet" href="/mycard/card.css">
  <style>
    :root {
      --bg-color: #ffffff;
      --card-bg: #161A22;
      --accent: #4F8CFF;
      --heading-link: #4F8CFF;
      --text-color: #E6EAF2;
      --text-muted: #9AA4B2;
      --card-border: #2A3140;
      --btn-bg: #1C2230;
      --danger: #E35D6A;
      --success: #2FBF71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { color: var(--heading-link); text-align: center; margin: 30px 0 10px; font-size: 1.5rem; letter-spacing: 1px; }
    p.sub { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 0.9rem; }
    section {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }
    h2 { color: var(--heading-link); font-size: 1.1rem; margin-bottom: 16px; font-weight: 500; }
    label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.3s;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--heading-link); }
    textarea { min-height: 80px; max-height: 80px; resize: none; }
    button {
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--heading-link);
      background-color: var(--btn-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s, border-color 0.3s;
    }
    button:hover { background-color: #26263a; border-color: var(--heading-link); }
    button.secondary {
      color: var(--text-muted);
      background-color: var(--btn-bg);
      border-color: var(--card-border);
      margin-left: 8px;
    }
    button.secondary:hover { background-color: #26263a; border-color: var(--heading-link); }
    button.danger {
      color: var(--danger);
      background-color: rgba(248,113,113,0.1);
      border-color: rgba(248,113,113,0.35);
    }
    button.danger:hover { background-color: rgba(248,113,113,0.18); }
    .msg { font-size: 0.9rem; margin-top: 12px; min-height: 1.2em; }
    .msg.ok { color: var(--success); }
    .msg.err { color: var(--danger); }
    .btn-row { display: flex; align-items: center; }
    .status { font-size: 0.85rem; color: #6b7280; text-align: center; margin-top: 20px; }
    .status a { color: var(--heading-link); text-decoration: none; }
    .page-list { margin-top: 12px; }
    .page-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      background: #13131a;
    }
    .page-list-item .id { color: var(--heading-link); font-weight: 600; }
    .page-list-item .dob { color: var(--text-muted); font-size: 0.85rem; margin-left: 8px; }
    .page-list-item .badges { font-size: 0.8rem; color: var(--text-muted); }
    .page-list-item .badge { margin-left: 6px; }
    .nfc-url { margin-bottom: 14px; }
    .login-section {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 40px 32px;
      margin-top: 60px;
      text-align: center;
    }
    .login-section h2 { color: var(--heading-link); font-size: 1.2rem; margin-bottom: 8px; }
    .login-section p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
    .login-section input { max-width: 300px; text-align: center; }
    .logout-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 0.85rem;
      padding: 8px 16px;
    }
    @media (max-width: 480px) {
      .btn-row { flex-direction: column; gap: 8px; }
      .btn-row button.secondary { margin-left: 0; }
    }

    .photo-position-section {
      margin: 16px 0;
      padding: 16px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: #13131a;
    }
    .photo-position-section .section-label {
      color: var(--heading-link);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: block;
    }
    .photo-preview-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .photo-preview-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 3px solid var(--heading-link);
      overflow: hidden;
      position: relative;
      cursor: grab;
      background: #1f1f2e;
      flex-shrink: 0;
      touch-action: none;
    }
    .photo-preview-circle:active { cursor: grabbing; }
    .photo-preview-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .photo-preview-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--text-muted);
    }
    .slider-group { width: 100%; max-width: 320px; }
    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: none;
      letter-spacing: 0;
    }
    .slider-group label .val { color: var(--heading-link); font-weight: 600; }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #2a2a38;
      outline: none;
      margin-bottom: 14px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--heading-link);
      cursor: pointer;
      border: none;
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--heading-link);
      cursor: pointer;
      border: none;
    }
    .position-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 4px;
    }
    .reset-pos-btn {
      font-size: 0.8rem;
      padding: 6px 16px;
      margin-top: 4px;
    }

    .container.wide { max-width: 1000px; }
    .editor-grid { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
    @media (min-width: 900px) {
      .editor-grid { grid-template-columns: 1fr 440px; }
      .preview-col { position: sticky; top: 16px; }
    }
    .fields { display: grid; grid-template-columns: 1fr; column-gap: 14px; }
    @media (min-width: 560px) {
      .fields { grid-template-columns: 1fr 1fr; }
      .field.full { grid-column: 1 / -1; }
    }
    .fields textarea { min-height: 120px; max-height: 260px; resize: vertical; }
    .color-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .color-row input[type="color"] {
      width: 56px;
      height: 40px;
      padding: 2px;
      background: var(--bg-color);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
    }
    .color-row label.inline { display: inline-flex; gap: 6px; align-items: center; margin: 0; text-transform: none; }
    .preview-box { background: #13131a; border-radius: 12px; padding: 12px; border: 1px dashed var(--card-border); }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .list-actions { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
    .list-actions button, .list-actions a { padding: 6px 12px; font-size: 0.8rem; }
    .list-actions a {
      color: var(--heading-link);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      background: var(--btn-bg);
    }
  </style>
</head>
