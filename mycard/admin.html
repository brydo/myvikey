<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V I Key® - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkbg: '#0a0a0f', cardbg: '#13131a' } } }
        }
    </script>
</head>
<body class="bg-darkbg text-white min-h-screen p-4 sm:p-8 font-sans">

    <div class="max-w-3xl mx-auto">
        <!-- Login Section -->
        <div id="login-section" class="max-w-sm mx-auto bg-cardbg border border-white/10 rounded-3xl p-6 shadow-2xl mt-12 text-center">
            <h2 class="text-xl font-bold mb-2">Admin Login</h2>
            <p class="text-xs text-gray-400 mb-4">Enter your secure admin password</p>
            <input type="password" id="admin-pass" placeholder="Password" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-xs text-white mb-3 text-center">
            <button onclick="adminLogin()" class="w-full bg-purple-600 hover:bg-purple-500 py-2.5 rounded-xl text-xs font-semibold transition">Login</button>
            <p id="login-err" class="text-xs text-red-400 mt-2 hidden">Incorrect password</p>
        </div>

        <!-- Dashboard Section (Hidden by default) -->
        <div id="dashboard-section" class="hidden bg-cardbg border border-white/10 rounded-3xl p-6 shadow-2xl space-y-6">
            <div class="flex justify-between items-center border-b border-white/10 pb-4">
                <h1 class="text-xl font-bold">⚡ V I Key® Card Manager</h1>
                <a href="./" class="text-xs text-purple-400 underline">View Public Card</a>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400">Card ID / Slug (e.g. alex)</label>
                    <input type="text" id="cfg-id" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white" value="alex">
                </div>
                <div>
                    <label class="text-xs text-gray-400">Display Name</label>
                    <input type="text" id="cfg-name" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div>
                    <label class="text-xs text-gray-400">Bio</label>
                    <textarea id="cfg-bio" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white" rows="2"></textarea>
                </div>
                <div>
                    <label class="text-xs text-gray-400">Avatar URL</label>
                    <input type="text" id="cfg-avatar" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <button onclick="saveCardData()" class="w-full bg-purple-600 hover:bg-purple-500 py-2.5 rounded-xl text-xs font-semibold transition">Save to Cloudflare KV</button>
                <p id="save-status" class="text-xs text-center text-green-400 hidden">Saved successfully!</p>
            </div>
        </div>
    </div>

    <script>
        let authToken = "";

        async function adminLogin() {
            const pass = document.getElementById('admin-pass').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });
            if (res.ok) {
                const data = await res.json();
                authToken = data.token;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadCardForEdit();
            } else {
                document.getElementById('login-err').classList.remove('hidden');
            }
        }

        async function loadCardForEdit() {
            const id = document.getElementById('cfg-id').value || 'alex';
            const res = await fetch(`/api/card?id=${id}`);
            if (res.ok) {
                const card = await res.json();
                document.getElementById('cfg-name').value = card.name || '';
                document.getElementById('cfg-bio').value = card.bio || '';
                document.getElementById('cfg-avatar').value = card.avatar || '';
            }
        }

        async function saveCardData() {
            const id = document.getElementById('cfg-id').value || 'alex';
            const payload = {
                id,
                name: document.getElementById('cfg-name').value,
                bio: document.getElementById('cfg-bio').value,
                avatar: document.getElementById('cfg-avatar').value,
                links: [{ title: "Website", url: "https://vi-key.uk", icon: "🌐" }]
            };

            const res = await fetch('/api/admin/save', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const st = document.getElementById('save-status');
                st.classList.remove('hidden');
                setTimeout(() => st.classList.add('hidden'), 3000);
            }
        }
    </script>
</body>
</html>
