<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VI Key® Card Manager</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; margin: 0; padding: 24px; color: #1f2937; }
    .card { max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 24px; }
    h1 { font-size: 20px; font-weight: bold; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #6b7280; margin-bottom: 4px; margin-top: 12px; }
    input[type="text"], input[type="password"], textarea { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 12px; font-size: 14px; margin-bottom: 8px; }
    input:focus, textarea:focus { outline: none; border-color: #2563eb; }
    button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: 600; transition: background 0.2s; }
    .btn-blue { background-color: #2563eb; color: #ffffff; width: 100%; }
    .btn-blue:hover { background-color: #1d4ed8; }
    .btn-green { background-color: #16a34a; color: #ffffff; width: 100%; margin-top: 12px; }
    .btn-green:hover { background-color: #15803d; }
    .btn-danger { background-color: transparent; color: #ef4444; padding: 0; font-size: 12px; }
    .flex-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .msg { font-size: 13px; margin-top: 8px; text-align: center; }
    .msg-error { color: #dc2626; }
    .msg-success { color: #16a34a; }
    .is-hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h1>⚡ VI Key® Card Manager</h1>

    <!-- LOGIN FORM -->
    <div id="login-section">
      <p style="font-size: 14px; color: #4b5563; margin-bottom: 12px;">Enter your secure admin password</p>
      <input type="password" id="admin-password" placeholder="Password" />
      <button onclick="handleLogin()" class="btn-blue">Login</button>
      <div id="login-msg" class="msg is-hidden"></div>
    </div>

    <!-- EDITOR FORM (Hidden until logged in) -->
    <div id="editor-section" class="is-hidden" style="border-top: 1px solid #e5e7eb; padding-top: 16px; margin-top: 16px;">
      <div class="flex-header">
        <a href="./#alex" target="_blank" style="color: #2563eb; font-size: 13px; text-decoration: none;">↗ View Public Card</a>
        <button onclick="handleLogout()" class="btn-danger">Logout</button>
      </div>

      <label>Card ID / Slug</label>
      <input type="text" id="card-id" value="alex" readonly style="background-color: #f9fafb;" />

      <label>Display Name</label>
      <input type="text" id="card-name" placeholder="Alex Rivers" />

      <label>Bio</label>
      <textarea id="card-bio" rows="3" placeholder="Digital creator..."></textarea>

      <label>Avatar Image URL</label>
      <input type="text" id="card-avatar" placeholder="https://..." />

      <button onclick="saveCardData()" class="btn-green">Save to Cloudflare KV</button>
      <div id="save-msg" class="msg is-hidden"></div>
    </div>
  </div>

  <script>
    // Direct endpoint connection to Cloudflare Worker
    const API_BASE = 'https://mycard.vikey.workers.dev/api';
    let authToken = localStorage.getItem('card_admin_token') || '';

    // Auto load editor if already logged in
    if (authToken) {
      showEditor();
      loadExistingData();
    }

    async function handleLogin() {
      const pwd = document.getElementById('admin-password').value;
      const msg = document.getElementById('login-msg');
      msg.className = 'msg';
      msg.textContent = 'Logging in...';
      msg.classList.remove('is-hidden');

      try {
        const res = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });
        const data = await res.json();

        if (res.ok && data.token) {
          authToken = data.token;
          localStorage.setItem('card_admin_token', authToken);
          msg.className = 'msg msg-success';
          msg.textContent = 'Logged in successfully!';
          setTimeout(() => {
            showEditor();
            loadExistingData();
          }, 400);
        } else {
          msg.className = 'msg msg-error';
          msg.textContent = 'Incorrect password';
        }
      } catch (err) {
        msg.className = 'msg msg-error';
        msg.textContent = 'Connection error to Worker API';
      }
    }

    function showEditor() {
      document.getElementById('login-section').classList.add('is-hidden');
      document.getElementById('editor-section').classList.remove('is-hidden');
    }

    function handleLogout() {
      localStorage.removeItem('card_admin_token');
      authToken = '';
      location.reload();
    }

    async function loadExistingData() {
      try {
        const res = await fetch(`${API_BASE}/card?id=alex`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById('card-name').value = data.name || '';
          document.getElementById('card-bio').value = data.bio || '';
          document.getElementById('card-avatar').value = data.avatar || '';
        }
      } catch (e) {}
    }

    async function saveCardData() {
      const msg = document.getElementById('save-msg');
      msg.className = 'msg';
      msg.textContent = 'Saving...';
      msg.classList.remove('is-hidden');

      const payload = {
        id: 'alex',
        name: document.getElementById('card-name').value,
        bio: document.getElementById('card-bio').value,
        avatar: document.getElementById('card-avatar').value,
        links: [{ title: 'Website', url: 'https://vi-key.uk', icon: '🌐' }]
      };

      try {
        const res = await fetch(`${API_BASE}/admin/save`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          msg.className = 'msg msg-success';
          msg.textContent = 'Saved successfully to KV!';
        } else {
          msg.className = 'msg msg-error';
          msg.textContent = 'Failed to save. Session expired.';
        }
      } catch (err) {
        msg.className = 'msg msg-error';
        msg.textContent = 'Error connecting to server.';
      }
    }
  </script>
</body>
</html>
