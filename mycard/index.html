<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyViKey</title>
  <link rel="stylesheet" href="./card.css" />
</head>
<body>
  <main class="container">
    <h1>MyViKey</h1>
    <p id="status">Ready</p>

    <button id="saveBtn">Save</button>
    <button id="loadBtn">Load</button>
  </main>

  <!-- Keep PUBLIC logic inline so you don't need a new file -->
  <script>
    (() => {
      const statusEl = document.getElementById('status');
      const saveBtn = document.getElementById('saveBtn');
      const loadBtn = document.getElementById('loadBtn');
      const STORAGE_KEY = 'myvikey_public_data';

      function setStatus(msg) {
        if (statusEl) statusEl.textContent = msg;
      }

      saveBtn?.addEventListener('click', () => {
        const payload = {
          updatedAt: new Date().toISOString(),
          note: 'Public page save'
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        setStatus('Saved.');
      });

      loadBtn?.addEventListener('click', () => {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return setStatus('No saved data found.');
        try {
          const data = JSON.parse(raw);
          setStatus(`Loaded: ${data.updatedAt ?? 'unknown time'}`);
        } catch {
          setStatus('Saved data is corrupted.');
        }
      });

      setStatus('Ready');
    })();
  </script>
</body>
</html>
