<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V I Key® - Bio & Link Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0a0f',
                        cardbg: '#13131a',
                        accent: '#8b5cf6'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        .animate-float { animation: float 8s ease-in-out infinite; }
        .animate-float-delayed { animation: float 10s ease-in-out 3s infinite; }
    </style>
</head>
<body class="bg-darkbg text-white min-h-screen relative font-sans overflow-x-hidden selection:bg-purple-500 selection:text-white">

    <!-- SHARED PERSISTENT BACKGROUND (Remains persistent on all routes) -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] animate-float"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] animate-float-delayed"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-pink-600/15 rounded-full blur-[120px] animate-float"></div>
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#1f1f2e15_1px,transparent_1px),linear-gradient(to_bottom,#1f1f2e15_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="relative z-10 min-h-screen flex flex-col items-center justify-start p-4 sm:p-8">
        <!-- Dynamic content (Profile or Admin) loads here -->
    </div>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
