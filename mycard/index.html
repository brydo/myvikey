<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vi-key.uk • MyCard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0f;
      --card: rgba(19, 19, 26, 0.8);
      --text: #ffffff;
      --bio: #d1d5db;
      --link: #e5e7eb;
      --footer: #6b7280;
      --accent: #9333ea;
      --accent-hover: #a855f7;
      --border: rgba(255,255,255,0.10);
      --row: rgba(255,255,255,0.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(147,51,234,0.2), transparent 60%),
        radial-gradient(900px 500px at 85% 20%, rgba(37,99,235,0.18), transparent 60%),
        radial-gradient(900px 500px at 50% 90%, rgba(219,39,119,0.16), transparent 60%),
        var(--bg);
      color: var(--text);
    }
    .card {
      width: min(92vw, 760px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(4px);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 3.2vw, 2.1rem);
      color: #fff;
    }
    p { margin: 8px 0; color: var(--bio); }
    .live {
      margin-top: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .2px;
    }
    .cta {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: background-color .2s, border-color .2s;
    }
    .cta:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .row {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--row);
      border: 1px solid var(--border);
      color: var(--link);
      transition: border-color .2s;
    }
    .row:hover { border-color: rgba(168,85,247,0.5); }
    code {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      color: var(--link);
    }
    .footer {
      margin-top: 16px;
      color: var(--footer);
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <main class="card" id="mycard">
    <h1>✅ vi-key.uk is live</h1>
    <p>This is a temporary landing page for deployment verification.</p>
    <p class="live">LIVE CHECK: <span id="timestamp"></span></p>
    <div class="row">Path: <code>/mycard/index.html</code></div>
    <a class="cta" href="/mycard/?id=demo">Open MyCard demo</a>
    <p class="footer">MyCard theme updated (main site index unchanged).</p>
  </main>

  <script>
    const ts = new Date();
    document.getElementById('timestamp').textContent = ts.toLocaleString();
  </script>
</body>
</html>
