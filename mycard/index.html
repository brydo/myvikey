<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vi-key.uk • Live Check</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 10%, #1e293b 0%, var(--bg) 55%);
      color: var(--text);
    }
    .card {
      width: min(92vw, 680px);
      background: color-mix(in oklab, var(--card) 86%, black);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.4rem, 3vw, 2rem);
    }
    p { margin: 8px 0; color: var(--muted); }
    .live {
      margin-top: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .2px;
    }
    code {
      background: #0b1220;
      border: 1px solid #1f2937;
      padding: 2px 6px;
      border-radius: 6px;
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <main class="card" id="mycard">
    <h1>✅ vi-key.uk is live</h1>
    <p>This is a temporary landing page for deployment verification.</p>
    <p class="live">LIVE CHECK: <span id="timestamp"></span></p>
    <p>Path: <code>/mycard/index.html</code></p>
  </main>

  <script>
    const ts = new Date();
    document.getElementById('timestamp').textContent = ts.toLocaleString();
  </script>
</body>
</html>
