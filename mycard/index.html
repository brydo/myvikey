<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V I Key® - Profile Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { darkbg: '#0a0a0f', cardbg: '#13131a' } }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-white min-h-screen relative font-sans flex flex-col items-center justify-center p-4">

    <!-- Shared Background Glows -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px]"></div>
    </div>

    <!-- Main Container -->
    <div id="card-container" class="relative z-10 w-full max-w-md bg-cardbg/80 backdrop-blur-xl border border-white/10 rounded-3xl p-6 shadow-2xl text-center">
        <div class="animate-pulse text-gray-400 text-xs py-10">Loading profile...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
