<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorial · V I Key®</title>
    <meta name="description" content="Explore memorial pages created with VI Key® — digital tributes that preserve and honour the memories of loved ones.">
    <meta property="og:title" content="Memorials · VI Key®">
    <meta property="og:description" content="Explore memorial pages created with VI Key® — digital tributes that preserve and honour the memories of loved ones.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vi-key.uk/memorials/">
    <meta property="og:image" content="https://vi-key.uk/apple-touch-icon.png">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        /* ===== Shared Page Styles ===== */
        :root {
            --bg-color: #12110F;
            --card-bg: rgba(255,255,255,0.04);
            --gold: #c9a96e;
            --text-color: #e8e6e3;
            --text-muted: #a8a4a0;
            --card-border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .header-bar {
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background-color: #12110F;
            z-index: 100;
            border-bottom: 1px solid rgba(201,169,110,0.2);
            overflow: hidden;
        }
        .header-bar img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            padding-top: 20px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .memorial-card {
            background-color: transparent;
            border: none;
            border-radius: 12px;
            padding: 32px;
            margin-top: 40px;
            text-align: center;
        }
        .memorial-photo {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--gold);
            margin-bottom: 24px;
        }
        .memorial-photo-placeholder {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: rgba(201,169,110,0.1);
            border: 3px solid var(--gold);
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
        }
        .memorial-name {
            color: var(--gold);
            font-size: 1.8rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .memorial-dates {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .memorial-text {
            color: var(--text-color);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 28px;
            white-space: pre-wrap;
            font-style: italic;
        }
        .audio-player {
            width: 100%;
            max-width: 360px;
            height: 32px;
            margin: 20px auto 0;
            border-radius: 8px;
        }
        .password-section {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 32px;
            margin-top: 60px;
            text-align: center;
        }
        .password-section h2 {
            color: var(--gold);
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .password-section p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        input[type="password"] {
            width: 100%;
            max-width: 300px;
            padding: 12px 14px;
            font-size: 1rem;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
        }
        input:focus { border-color: var(--gold); }
        button {
            padding: 12px 32px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--gold);
            background-color: rgba(201,169,110,0.1);
            border: 1px solid rgba(201,169,110,0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: rgba(201,169,110,0.2); }
        .msg { font-size: 0.9rem; margin-top: 12px; min-height: 1.2em; color: #ff6b6b; }
        .loading { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 1rem; }
        .error-page { text-align: center; padding: 60px 20px; }
        .error-page h2 { color: var(--gold); font-size: 1.3rem; margin-bottom: 12px; }
        .error-page p { color: var(--text-muted); font-size: 0.95rem; }
        .back-link { display: block; text-align: center; margin-top: 30px; color: var(--gold); text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        .candle { font-size: 2rem; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="header-bar">
        <img src="https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/memorial.png" alt="V I Key® Memorials">
    </div>
    <div class="container">
        <div id="loading" class="loading">Loading memorial…</div>
        <div id="passwordPrompt" class="password-section" style="display:none;">
            <div class="candle">🕯️</div>
            <h2>This memorial is private</h2>
            <p>Please enter the password to view this memorial.</p>
            <input type="password" id="passInput" placeholder="Password" autofocus>
            <br>
            <button onclick="submitPassword()">Enter</button>
            <div class="msg" id="passMsg"></div>
        </div>
        <div id="memorial" class="memorial-card" style="display:none;">
            <div id="photoContainer"></div>
            <h1 class="memorial-name" id="memName"></h1>
            <div class="memorial-dates" id="memDob"></div>
            <div class="memorial-text" id="memText"></div>
            <div id="audioContainer"></div>
        </div>
        <div id="notFound" class="error-page" style="display:none;">
            <h2>Memorial not found</h2>
            <p>No memorial exists with that ID. Please check the link and try again.</p>
        </div>
        <a href="/" class="back-link">← Back to home</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const memorialId = params.get('id');

        if (!memorialId) {
            const loading = document.getElementById('loading');
            const linkText = document.createElement('strong');
            linkText.textContent = '/memorials/?id=john';
            loading.replaceChildren(document.createTextNode('No memorial ID specified. Please use a link like '), linkText);
        } else {
            loadMemorial();
        }

        /* ===== API Helpers ===== */
        async function safeJson(resp) {
            const text = await resp.text();
            if (!text) return {};
            try { return JSON.parse(text); }
            catch { return { error: 'Invalid response' }; }
        }

        async function loadMemorial(password) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('passwordPrompt').style.display = 'none';
            document.getElementById('memorial').style.display = 'none';
            document.getElementById('notFound').style.display = 'none';

            try {
                const body = { action: 'get-content', id: memorialId };
                if (password) body.password = password;

                const resp = await fetch('/api/content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await safeJson(resp);

                document.getElementById('loading').style.display = 'none';

                if (resp.ok && data.success && data.content) {
                    showMemorial(data.content);
                } else if (resp.status === 401 || data.requiresPassword) {
                    document.getElementById('passwordPrompt').style.display = 'block';
                    document.getElementById('passInput').focus();
                } else {
                    document.getElementById('notFound').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('loading').textContent = 'Error loading memorial: ' + e.message;
            }
        }

        async function submitPassword() {
            const pass = document.getElementById('passInput').value.trim();
            const msg = document.getElementById('passMsg');
            if (!pass) { msg.textContent = 'Please enter a password.'; return; }
            msg.textContent = '';

            try {
                const resp = await fetch('/api/password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'verify', id: memorialId, password: pass })
                });
                const data = await safeJson(resp);

                if (resp.ok && data.success) {
                    loadMemorial(pass);
                } else {
                    msg.textContent = '✗ Incorrect password. Please try again.';
                    document.getElementById('passInput').value = '';
                    document.getElementById('passInput').focus();
                }
            } catch (e) {
                msg.textContent = '✗ Error: ' + e.message;
            }
        }

        document.getElementById('passInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitPassword();
        });

        /* ===== Memorial Rendering ===== */
        function showMemorial(content) {
            const mem = document.getElementById('memorial');
            document.getElementById('memName').textContent = content.name || 'In Loving Memory';

            if (content.dob) {
                document.getElementById('memDob').textContent = content.dob;
                document.getElementById('memDob').style.display = 'block';
            } else {
                document.getElementById('memDob').textContent = '';
                document.getElementById('memDob').style.display = 'none';
            }

            if (content.photoUrl) {
                const photo = document.createElement('img');
                photo.src = content.photoUrl;
                photo.className = 'memorial-photo';
                photo.alt = content.name || 'Memorial';
                if (content.photoPosition) photo.style.objectPosition = content.photoPosition;
                document.getElementById('photoContainer').replaceChildren(photo);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'memorial-photo-placeholder';
                placeholder.textContent = '🕯️';
                document.getElementById('photoContainer').replaceChildren(placeholder);
            }

            if (content.text) {
                document.getElementById('memText').textContent = content.text;
            } else {
                document.getElementById('memText').textContent = 'Forever in our hearts.';
            }

            if (content.audioUrl) {
                var audioSrc = content.audioUrl;
                if (!audioSrc.startsWith('/api/') && !audioSrc.startsWith('http')) {
                    audioSrc = '/api/audio?file=' + encodeURIComponent(audioSrc);
                }
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.className = 'audio-player';
                audio.setAttribute('controlslist', 'nodownload');
                audio.src = audioSrc;
                document.getElementById('audioContainer').replaceChildren(audio);
            } else {
                document.getElementById('audioContainer').replaceChildren();
            }

            mem.style.display = 'block';
        }
    </script>
</body>
</html>
