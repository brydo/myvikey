<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorial · V I Key®</title>
    <meta name="description" content="Explore memorial pages created with VI Key® — digital tributes that preserve and honour the memories of loved ones.">
    
    <!-- Open Graph Meta Tags for Social Sharing -->
    <meta property="og:title" content="Memorials · VI Key®">
    <meta property="og:description" content="Explore memorial pages created with VI Key® — digital tributes that preserve and honour the memories of loved ones.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vi-key.uk/memorials/">
    <meta property="og:image" content="https://vi-key.uk/apple-touch-icon.png">
    <meta property="og:image:width" content="180">
    <meta property="og:image:height" content="180">
    <meta property="og:locale" content="en_GB">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Memorials · VI Key®">
    <meta name="twitter:description" content="Create beautiful digital memorials with photos, music, and stories">
    <meta name="twitter:image" content="https://vi-key.uk/apple-touch-icon.png">
    
    <!-- Additional SEO Meta Tags -->
    <meta name="keywords" content="online memorial, digital tribute, pet memorial, remembrance, memorial pages">
    <meta name="author" content="VI Key®">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://vi-key.uk/memorials/">
    
    <!-- Schema.org Structured Data - WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "V I Key Memorials",
      "description": "Create and share beautiful online memorials with photos, music, and meaningful stories",
      "url": "https://vi-key.uk/memorials/",
      "image": "https://vi-key.uk/apple-touch-icon.png",
      "applicationCategory": "UtilitiesApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "GBP"
      }
    }
    </script>
    
    <!-- Schema.org Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "VI Key",
      "url": "https://vi-key.uk",
      "logo": "https://vi-key.uk/favicon-32x32.png",
      "description": "Digital memorials and tributes platform",
      "sameAs": [
        "https://github.com/brydo/myvikey"
      ]
    }
    </script>
    
    <style>
        /* ===== Shared Page Styles ===== */
        :root {
            --bg-color: #12110F;
            --card-bg: rgba(255,255,255,0.04);
            --gold: #c9a96e;
            --text-color: #e8e6e3;
            --text-muted: #a8a4a0;
            --card-border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .header-bar {
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background-color: #12110F;
            z-index: 100;
            border-bottom: 1px solid rgba(201,169,110,0.2);
            overflow: hidden;
        }
        .header-bar img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            padding-top: 20px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .memorial-card {
            background-color: transparent;
            border: none;
            border-radius: 12px;
            padding: 32px;
            margin-top: 40px;
            text-align: center;
        }
        .memorial-photo {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--gold);
            margin-bottom: 24px;
        }
        .memorial-photo-placeholder {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: rgba(201,169,110,0.1);
            border: 3px solid var(--gold);
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
        }
        .memorial-name {
            color: var(--gold);
            font-size: 1.8rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .memorial-dates {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .memorial-text {
            color: var(--text-color);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 28px;
            white-space: pre-wrap;
            font-style: italic;
        }
        .audio-player {
            width: 100%;
            max-width: 400px;
            margin: 24px auto;
            padding: 16px;
            background-color: rgba(201,169,110,0.1);
            border: 1px solid rgba(201,169,110,0.3);
            border-radius: 8px;
        }
        .error-message {
            color: #ff6b6b;
            text-align: center;
            font-size: 1rem;
            margin: 20px 0;
        }
        .home-link {
            text-align: center;
            margin-top: 40px;
        }
        .home-link a {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.95rem;
            transition: opacity 0.3s;
        }
        .home-link a:hover {
            opacity: 0.7;
        }
        @media (max-width: 480px) {
            .memorial-photo, .memorial-photo-placeholder {
                width: 180px;
                height: 180px;
            }
            .memorial-name {
                font-size: 1.5rem;
            }
            .memorial-text {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <img src="/memorials/header.jpg" alt="V I Key Memorials Header" onerror="this.style.display='none'">
    </div>

    <div class="container">
        <div class="memorial-card" id="memorialContent">
            <div class="memorial-photo-placeholder">🕯️</div>
            <p class="error-message">Loading memorial...</p>
        </div>

        <div class="home-link">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script>
        async function loadMemorial() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                document.getElementById('memorialContent').innerHTML = `
                    <div class="memorial-photo-placeholder">🕯️</div>
                    <p class="error-message">No memorial ID provided.</p>
                `;
                return;
            }

            try {
                const resp = await fetch('/api/content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get-content', id })
                });

                const data = await resp.json();

                if (!data.success || !data.content) {
                    document.getElementById('memorialContent').innerHTML = `
                        <div class="memorial-photo-placeholder">🕯️</div>
                        <p class="error-message">Memorial not found.</p>
                    `;
                    return;
                }

                const content = data.content;
                const photoHtml = content.photoUrl
                    ? `<img src="${content.photoUrl}" alt="${content.name || 'Memorial'}" class="memorial-photo" style="object-position: ${content.photoPosition || '50% 50%'}">`
                    : '<div class="memorial-photo-placeholder">🕯️</div>';

                const audioHtml = content.audioUrl
                    ? `<div class="audio-player"><audio controls style="width: 100%;"><source src="${content.audioUrl}"></audio></div>`
                    : '';

                // Update page title and meta tags dynamically
                document.title = (content.name || 'Memorial') + ' · V I Key®';
                document.querySelector('meta[name="description"]').content = `${content.name || 'Memorial'} - A digital tribute. ${content.text ? content.text.substring(0, 100) : ''}`;
                document.querySelector('meta[property="og:title"]').content = content.name || 'Memorial · VI Key®';
                document.querySelector('meta[property="og:description"]').content = content.text || 'A beautiful digital memorial';
                if (content.photoUrl) {
                    document.querySelector('meta[property="og:image"]').content = content.photoUrl;
                }

                document.getElementById('memorialContent').innerHTML = `
                    ${photoHtml}
                    <h1 class="memorial-name">${content.name || 'Memorial'}</h1>
                    ${content.dob ? `<div class="memorial-dates">${content.dob}</div>` : ''}
                    ${content.text ? `<p class="memorial-text">${content.text}</p>` : ''}
                    ${audioHtml}
                `;

            } catch (error) {
                document.getElementById('memorialContent').innerHTML = `
                    <div class="memorial-photo-placeholder">🕯️</div>
                    <p class="error-message">Error loading memorial: ${error.message}</p>
                `;
            }
        }

        loadMemorial();
    </script>
</body>
</html>
