<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorials · V I Key®</title>
    <style>
        :root {
            --bg-base: #12110F;
            --card-bg: rgba(255, 255, 255, 0.04);
            --gold: #c9a96e;
            --text-color: #e8e6e3;
            --text-muted: #a8a4a0;
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            color: var(--gold);
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        section {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 15px;
            color: var(--text-color);
            font-size: 1.05rem;
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
        }

        .back-link a {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: var(--text-muted);
        }

        .error-msg {
            color: #ff6b6b;
            text-align: center;
            padding: 40px 20px;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-msg">
            <div style="font-size: 2.5rem; margin-bottom: 16px;">🕯️</div>
            <p>No memorial ID specified. Please use a link like <strong>/memorials/?id=margaret</strong></p>
            <div class="back-link" style="margin-top: 24px;">
                <a href="/">← Back to home</a>
            </div>
        </div>
    </div>

</body>
</html>
