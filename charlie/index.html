<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlie Memorial</title>

<style>
  body {
    margin: 0;
    padding: 0;
    padding-bottom: 100px;
    font-family: "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #222 0%, #050505 60%);
    color: #eee;
    text-align: center;
  }

  .container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
  }

  .hero img {
    width: 100%;
    max-width: 420px;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(255,255,255,0.15);
    margin-top: 20px;
  }

  h1 {
    font-size: 32px;
    margin-top: 25px;
    font-weight: 600;
  }

  .subtitle {
    font-size: 20px;
    color: #ccc;
    margin-bottom: 25px;
  }

  .audio-card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(255,255,255,0.1);
    margin-top: 25px;
    backdrop-filter: blur(4px);
  }

  audio {
    width: 100%;
    margin-top: 10px;
  }

  audio::-internal-media-controls-download-button {
    display: none;
  }

  audio::-webkit-media-controls-enclosure {
    overflow: hidden;
  }

  audio::-webkit-media-controls-panel {
    width: calc(100% + 30px);
  }

  .divider {
    margin: 40px auto 20px;
    width: 120px;
    height: 2px;
    background: linear-gradient(to right, transparent, #888, transparent);
    border-radius: 2px;
  }

  .tribute-line {
    font-size: 18px;
    color: #ccc;
    letter-spacing: 0.5px;
    margin-bottom: 30px;
  }

  .back-link {
    display: inline-block;
    margin-top: 20px;
    color: #888;
    font-size: 14px;
    text-decoration: none;
    transition: 0.25s ease;
  }

  .back-link:hover {
    color: #ccc;
  }

  /* Persistent Footer */
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: #0d0c0a;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 15px 20px;
    display: flex;
    justify-content: center;
    gap: 30px;
    z-index: 1000;
  }

  .footer-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 16px;
    line-height: 1;
    text-decoration: none;
    color: #e8e6e3;
    transition: color 0.3s;
  }

  .footer-btn .whatsapp-icon {
    width: 1em;
    height: 1em;
    fill: #25D366;
    display: inline-block;
    vertical-align: middle;
  }

  .footer-btn .email-icon {
    font-size: 1em;
    display: inline-block;
    line-height: 1;
  }

  .footer-btn:hover {
    color: #c9a96e;
  }

  @media (max-width: 480px) {
    footer {
      gap: 15px;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }
    body {
      padding-bottom: 120px;
    }
  }
</style>
</head>

<body>
<div class="container">

  <h1>In Loving Memory</h1>
  <div class="subtitle">of Charlie</div>

  <div class="hero">
    <img src="https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/Charlie _portrait.jpg" alt="Memorial Photo">
  </div>

  <div class="audio-card">
    <p>Play Charlie&rsquo;s song:</p>
    <audio controls controlslist="nodownload">
      <source src="https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/friend.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="divider"></div>

  <div class="tribute-line">
    Made with love in memory of Charlie &bull; Forever in our hearts
  </div>

  <a class="back-link" href="/">&larr; Back to home</a>

</div>

<!-- Persistent Action Footer -->
<footer>
    <a href="https://wa.me/qr/S3WV63OUV4CTP1" class="footer-btn" target="_blank" rel="noopener noreferrer">
        <svg class="whatsapp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-1.157 4.228 4.305-1.129z"/>
        </svg>
        <span>WhatsApp Us</span>
    </a>
    <a href="mailto:vikeyshop@outlook.com" class="footer-btn">
        <span class="email-icon">✉</span>
        <span>Email Us</span>
    </a>
</footer>

</body>
</html>
