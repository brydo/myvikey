

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlie Memorial</title>

<style>
  :root {
    --bg-base: #12110F;
    --bg-gradient: radial-gradient(circle at top, #1c1a16 0%, #12110F 70%);
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-border-hover: rgba(255, 255, 255, 0.14);
    --accent: #c9a96e;
    --accent-hover: #d4b883;
    --accent-glow: rgba(201, 169, 110, 0.15);
    --text: #e8e6e3;
    --text-muted: #a8a4a0;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-gradient);
    background-color: var(--bg-base);
    color: var(--text);
    text-align: center;
  }

  .container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
  }

  .hero img {
    width: 100%;
    max-width: 420px;
    border-radius: 12px;
    box-shadow: 0 0 25px var(--accent-glow);
    margin-top: 20px;
    border: 1px solid var(--card-border);
  }

  h1 {
    font-size: 32px;
    margin-top: 25px;
    font-weight: 600;
    color: var(--accent);
  }

  .subtitle {
    font-size: 20px;
    color: var(--text-muted);
    margin-bottom: 25px;
  }

  .audio-card {
    background: var(--card-bg);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    box-shadow: 0 0 15px var(--accent-glow);
    margin-top: 25px;
    backdrop-filter: blur(4px);
  }

  audio {
    width: 100%;
    margin-top: 10px;
  }

  audio::-internal-media-controls-download-button {
    display: none;
  }

  audio::-webkit-media-controls-enclosure {
    overflow: hidden;
  }

  audio::-webkit-media-controls-panel {
    width: calc(100% + 30px);
  }

  .divider {
    margin: 40px auto 20px;
    width: 120px;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    border-radius: 2px;
    opacity: 0.5;
  }

  .tribute-line {
    font-size: 18px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin-bottom: 30px;
  }

  .site-footer {
    margin-top: 30px;
    padding: 25px 0;
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    border-top: 1px solid var(--card-border);
    letter-spacing: 0.5px;
    line-height: 1.6;
  }

  .whatsapp-logo {
    width: 40px;
    height: 40px;
    margin-top: 10px;
    opacity: 0.9;
  }

  .whatsapp-text-link {
    display: block;
    margin-top: 8px;
    color: var(--accent);
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: 0.25s ease;
  }

  .whatsapp-text-link:hover {
    color: var(--accent-hover);
  }

  .back-link {
    display: inline-block;
    margin-top: 20px;
    color: var(--text-muted);
    font-size: 14px;
    text-decoration: none;
    transition: 0.25s ease;
  }

  .back-link:hover {
    color: var(--text);
  }
</style>
</head>

<body>
<div class="container">

  <h1>In Loving Memory</h1>
  <div class="subtitle">of Charlie</div>

  <div class="hero">
    <img src="https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/Charlie _portrait.jpg" alt="Memorial Photo">
  </div>

  <div class="audio-card">
    <p>Play Charlie&rsquo;s song:</p>
    <audio controls controlslist="nodownload">
      <source src="https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/friend.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="divider"></div>

  <div class="tribute-line">
    Made with love in memory of Charlie &bull; Forever in our hearts
  </div>

  <a class="back-link" href="/">&larr; Back to home</a>

  <footer class="site-footer">
    <p>VI key&reg; 2026<br>Brian McManus</p>

    <img class="whatsapp-logo" src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp Logo">

    <a class="whatsapp-text-link"
       href="https://wa.me/qr/S3WV63OUV4CTP1"
       target="_blank">
      Chat on WhatsApp
    </a>
  </footer>

</div>
</body>
</html>
