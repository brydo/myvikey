<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Loving Memory of [NAME]</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Georgia", "Segoe UI", serif;
    background: #000000;
    color: #eee; text-align: center;
  }
  .banner {
    width: 100%;
    height: 16.66vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .logo {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 0;
  }
  .logo img {
    max-width: 200px;
    height: auto;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.2)) brightness(1.05) contrast(1.1);
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    transition: filter 0.3s ease;
  }
  .logo img:hover {
    filter: drop-shadow(0 0 30px rgba(255,255,255,0.4)) brightness(1.1) contrast(1.15);
  }
  .container { max-width: 700px; margin: auto; padding: 20px; }
  .paw { font-size: 40px; margin-bottom: 10px; }
  .candle { font-size: 45px; margin-bottom: 15px; animation: flicker 2.5s infinite alternate; }
  @keyframes flicker {
    0% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
    100% { opacity: 0.85; transform: scale(1); }
  }
  h1 { font-size: 32px; margin-top: 15px; font-weight: 400; letter-spacing: 1px; }
  .subtitle { font-size: 20px; color: #aaa; margin-bottom: 25px; font-style: italic; }
  .hero img {
    width: 100%; max-width: 420px; border-radius: 12px;
    box-shadow: 0 0 25px rgba(255,255,255,0.12);
    margin-top: 20px;
  }
  .audio-card {
    background: rgba(255,255,255,0.04); padding: 20px; border-radius: 12px;
    box-shadow: 0 0 15px rgba(255,255,255,0.08); margin-top: 25px;
    backdrop-filter: blur(4px);
  }
  .audio-card p { font-style: italic; color: #aaa; }
  audio::-webkit-media-controls-timeline,
  audio::-moz-media-controls-timeline {
    display: none;
  }
  audio { 
    width: 100%; 
    margin-top: 10px;
    accent-color: #888;
  }
  .divider { margin: 40px auto 20px; width: 120px; height: 2px; background: linear-gradient(to right, transparent, #555, transparent); border-radius: 2px; }
  .quote { font-size: 16px; color: #888; line-height: 1.8; max-width: 450px; margin: 0 auto 30px; font-style: italic; }
  .tribute-line { font-size: 18px; color: #aaa; letter-spacing: 0.5px; margin-bottom: 30px; }
  .back-link { display: inline-block; margin-top: 20px; color: #777; font-size: 14px; text-decoration: none; transition: 0.25s ease; }
  .back-link:hover { color: #aaa; }
  .site-footer {
    margin-top: 30px; padding: 25px 0; font-size: 14px; color: #888;
    text-align: center; border-top: 1px solid rgba(255,255,255,0.06);
    line-height: 1.8;
  }
  .contact-links { margin-top: 12px; }
  .contact-link { color: #666; font-size: 13px; font-weight: 400; text-decoration: none; transition: 0.25s ease; margin: 0 8px; }
  .contact-link:hover { color: #aaa; }
  .contact-separator { color: #444; font-size: 13px; }
</style>
</head>
<body>
<div class="banner"></div>
<div class="logo">
  <img src="https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/logo.svg" alt="Logo">
</div>
<div class="container">
  <div class="paw">&#128062;</div>
  <div class="candle">&#128367;</div>
  <h1>In Loving Memory</h1>
  <div class="subtitle">of [NAME]</div>
  <div class="hero">
    <img src="[PHOTO URL]" alt="Memorial Photo">
  </div>
  <div class="audio-card">
    <p>Play [NAME]&rsquo;s song:</p>
    <audio controls controlsList="nodownload">
      <source src="[SONG URL]" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>
  <div class="divider"></div>
  <div class="quote">"If love could have saved you, you would have lived forever.<br>Run free, good boy, over the Rainbow Bridge."</div>
  <div class="tribute-line">A loyal friend &bull; The best of boys &bull; Forever in our hearts</div>
  <a class="back-link" href="/">&larr; Back to home</a>
  <footer class="site-footer">
    <p>VI key&reg; 2026<br>Brian McManus</p>
    <div class="contact-links">
      <a class="contact-link" href="https://wa.me/447526345287?text=hi%2C%20can%20you%20give%20me%20more%20info%20please" target="_blank">WhatsApp</a>
      <span class="contact-separator">&bull;</span>
      <a class="contact-link" href="mailto:vikeyshop@outlook.com">Email</a>
      <span class="contact-separator">&bull;</span>
      <a class="contact-link" href="tel:07526345287">Call</a>
    </div>
  </footer>
</div>
</body>
</html>
