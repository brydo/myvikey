<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petri's Menu</title>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
      --accent-color: #e50914;
      --price-color: #ffb703;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      max-width: 750px;
      margin: 30px auto 0 auto;
      padding: 0 15px;
    }

    .menu-header {
      text-align: center;
      margin-bottom: 25px;
    }

    /* Top Dead Centre SVG Logo Container */
    .brand-logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    .brand-logo-svg {
      width: 220px;
      height: auto;
      max-width: 100%;
    }

    .menu-header h1 {
      font-size: 28px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 0 0 5px 0;
    }

    .menu-header p {
      color: var(--text-sub);
      font-size: 14px;
      margin: 0 0 10px 0;
    }

    /* Clickable Phone Number Styling */
    .phone-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--price-color);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s ease;
      margin-top: 5px;
    }

    .phone-link:hover {
      color: var(--accent-color);
      text-decoration: underline;
    }

    .accordion {
      background-color: var(--card-bg);
      color: var(--text-main);
      cursor: pointer;
      padding: 16px 20px;
      width: 100%;
      border: 1px solid var(--border-color);
      text-align: left;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease-in-out;
      margin-top: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .accordion:hover, .accordion.active {
      background-color: #2a2a2a;
      border-color: var(--accent-color);
    }

    .accordion-icon {
      font-size: 18px;
      color: var(--accent-color);
      transition: transform 0.3s ease;
    }

    .accordion.active .accordion-icon {
      transform: rotate(45deg);
    }

    .panel {
      padding: 0 20px;
      background-color: #181818;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      border: 1px solid var(--border-color);
      border-top: none;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid #282828;
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .item-details {
      padding-right: 15px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
      display: block;
      color: #fff;
    }

    .item-desc {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 3px;
      line-height: 1.4;
    }

    .item-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--price-color);
      white-space: nowrap;
    }

    /* Persistent Footer */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #0d0c0a;
      border-top: 1px solid var(--border-color);
      padding: 15px 20px;
      display: flex;
      justify-content: center;
      gap: 30px;
      z-index: 1000;
    }

    .footer-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      line-height: 1;
      text-decoration: none;
      color: var(--text-main);
      transition: color 0.3s;
    }

    .footer-btn .whatsapp-icon {
      width: 1em;
      height: 1em;
      fill: #25D366;
      display: inline-block;
      vertical-align: middle;
    }

    .footer-btn .facebook-icon {
      width: 1em;
      height: 1em;
      fill: #1877F2;
      display: inline-block;
      vertical-align: middle;
    }

    .footer-btn .instagram-icon {
      width: 1em;
      height: 1em;
      fill: #E4405F;
      display: inline-block;
      vertical-align: middle;
    }

    .footer-btn .tiktok-icon {
      width: 1em;
      height: 1em;
      fill: #e8e6e3;
      display: inline-block;
      vertical-align: middle;
    }

    .footer-btn .email-icon {
      font-size: 1em;
      display: inline-block;
      line-height: 1;
    }

    .footer-btn:hover {
      color: var(--price-color);
    }

    @media (max-width: 480px) {
      footer {
        gap: 20px;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: center;
        padding: 10px;
      }
      body {
        padding-bottom: 120px;
      }
    }
  </style>
</head>
<body>

    <h1>Petri's Menu</h1>
