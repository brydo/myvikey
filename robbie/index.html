

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robbie Memorial</title>

<style>
  :root {
    --bg-base: #12110F;
    --bg-gradient: radial-gradient(circle at top, #1c1a16 0%, #12110F 70%);
    --card-bg: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-border-hover: rgba(255, 255, 255, 0.14);
    --accent: #c9a96e;
    --accent-hover: #d4b883;
    --accent-glow: rgba(201, 169, 110, 0.15);
    --text: #e8e6e3;
    --text-muted: #a8a4a0;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-gradient);
    background-color: var(--bg-base);
    color: var(--text);
    text-align: center;
  }

  .container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
  }

  .hero img {
    width: 100%;
    max-width: 420px;
    border-radius: 12px;
    box-shadow: 0 0 25px var(--accent-glow);
    margin-top: 20px;
    border: 1px solid var(--card-border);
  }

  h1 {
    font-size: 32px;
    margin-top: 25px;
    font-weight: 600;
    color: var(--accent);
  }

  .subtitle {
    font-size: 20px;
    color: var(--text-muted);
    margin-bottom: 25px;
  }

  .audio-card {
    background: var(--card-bg);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    box-shadow: 0 0 15px var(--accent-glow);
    margin-top: 25px;
    backdrop-filter: blur(4px);
  }

  audio {
    width: 100%;
    margin-top: 10px;
  }

  audio::-internal-media-controls-download-button {
    display: none;
  }

  audio::-webkit-media-controls-enclosure {
    overflow: hidden;
  }

  audio::-webkit-media-controls-panel {
    width: calc(100% + 30px);
  }

  .divider {
    margin: 40px auto 20px;
    width: 120px;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    border-radius: 2px;
    opacity: 0.5;
  }

  .tribute-line {
    font-size: 18px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin-bottom: 30px;
  }

  .site-footer {
    text-align: center;
    padding: 2rem 1.5rem;
    background: rgba(255, 255, 255, 0.02);
    border-top: 1px solid var(--card-border);
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .site-footer a {
    color: var(--accent);
    text-decoration: none;
  }

  .site-footer a:hover {
    text-decoration: underline;
  }

  .logout-btn {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.5rem 1.5rem;
    background: transparent;
    border: 1px solid var(--card-border-hover);
    border-radius: 5px;
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    transition: all 0.2s;
  }

  .logout-btn:hover {
    background: var(--card-bg);
    border-color: var(--accent);
    color: var(--accent);
  }

  .back-link {
    display: inline-block;
    margin-top: 20px;
    color: var(--text-muted);
    font-size: 14px;
    text-decoration: none;
    transition: 0.25s ease;
  }

  .back-link:hover {
    color: var(--text);
  }
</style>
</head>

<body>
<div class="container">

  <h1>In Loving Memory</h1>
  <div class="subtitle">of Robbie</div>

  <div class="hero">
    <img src="https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/robbi1.jpg" alt="Memorial Photo">
    <img src="https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/robbi2.jpg" alt="Memorial Photo" style="margin-top: 15px;">
  </div>

  <div class="audio-card">
    <p>Play Robbie&rsquo;s song:</p>
    <audio controls controlslist="nodownload">
      <source src="https://pub-07ed0b0955a4401f9956c3ca7a33c40e.r2.dev/mbl.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="divider"></div>

  <div class="tribute-line">
    Made with love in memory of Robbie &bull; Forever in our hearts
  </div>

  <a class="back-link" href="/">&larr; Back to home</a>

  <footer class="site-footer">
    <p>In loving memory of Robbie &mdash; gone but never forgotten.</p>
    <p style="margin-top: 0.5rem;">For inquiries: <a href="mailto:brydo@outlook.com">brydo@outlook.com</a></p>
    <form method="POST" action="/__logout">
      <button type="submit" class="logout-btn">Log out</button>
    </form>
  </footer>

</div>
</body>
</html>
