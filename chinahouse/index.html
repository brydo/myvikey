            vertical-align: middle;
        }

        .footer-btn .facebook-icon {
            width: 1em;
            height: 1em;
            fill: #1877F2;
            display: inline-block;
            vertical-align: middle;
        }

        .footer-btn .email-icon {
            font-size: 1em;
            display: inline-block;
            line-height: 1;
        }

        .footer-btn:hover {
            color: #c9a96e;
        }

        @media (max-width: 480px) {
            footer {
                gap: 15px;
                flex-direction: column;
                align-items: center;
                padding: 10px;
            }
            body {
                padding-bottom: 120px;
            }
